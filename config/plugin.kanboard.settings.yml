# Kanboard — core/config/plugin.kanboard.settings.yml
#
# The Kanboard the dashboard reads tasks from: a site the builder made (https://<name>.ddev.site), or your own. The
# username and the API access token are an account's there, so the dashboard acts as that person:
# `cmd-tools-kanboard-cli.sh <site> --connect <login>` makes the token with Kanboard's own code. Never printed.
# The Kanboard address, without a trailing slash.
url: CHANGE_ME
# The username of the account the dashboard reads (and, with writes on, writes) as.
username: CHANGE_ME
# The API access token of that account (My profile → API on your own Kanboard).
token: CHANGE_ME
# The tasks as work items (the tracker family). See @webship.co/workspace-tracker for every key.
# Writes to Kanboard: comments, moves on the board, closing and opening, tags, assignees, logged time, new tasks. Off by default.
allow_writes: false
# Author sessions at once.
max_agents: 1
# The Kanboard project a workspace project works against when it remembers none: its name (Webship site).
default_scope: ""
# The Kanboard projects (their names) the list may be switched to; empty is any project the account has.
scopes: []
# branch: a new branch in the project; worktree: a git worktree outside the workspace folders.
work_in: branch
# required: Claude Code's sandbox for the author session, and no session without it; off: a person's choice.
sandbox: required
# Domains the sandbox allows (the project's package registries).
network_domains: []
# WebFetch and WebSearch in the author session.
allow_web: false
# The comments a snapshot keeps: members (the project's managers and members), all, none.
comments_from: members
# A task from outside the project (made, or last edited, by a viewer of the project or someone it does not have): analyze (work it only after a confirmation that names its author) or refuse.
outsider_items: analyze
